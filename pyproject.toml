[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-htr"
version = "0.1.0"
description = "Конфигурируемый пайплайн обучения и инференса для строкового HTR/OCR на PyTorch."
requires-python = ">=3.9"
dependencies = [
  "torch>=2.0",
  "torchvision>=0.15",
  "pillow>=9.5",
  "pyyaml>=6.0",
  "numpy>=1.24",
  "tqdm>=4.65",
  "matplotlib>=3.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
htr-train = "htr.cli:train_main"
htr-infer = "htr.cli:infer_main"
