# §4.4 — планируемый двухэтапный контур «детектор → строковый распознаватель». Пока в коде есть только строковый этап (данные coco_lines); обучение соответствует §4.3 с уменьшенным d_model.

methodology_profile:
  report_section: "4.4"
  short_name: page_detector_then_line_placeholder_line_phase
  status: partially_implemented
  note: Детектор страниц не запускается; цепочка как §4.3 на вырезках строки (плейсхолдер до полностраничного COCO и детектора).

detector_training:
  status: scaffold
  coco_json_placeholder: ""  # путь к COCO full-page когда появится
  image_root_placeholder: ""
  batch_size_placeholder: null
  epochs_placeholder: null
  lr_placeholder: null

line_recognizer_training_reference:
  # Для воспроизводимости строкового блока после вырезаний использовать один из конфигов:
  # configs/baselines/4_01_line_crnn_ctc_digital_peter.yaml или последующую реализацию §4.2/4.3.
  recommends_overlay_after_detector: configs/baselines/4_01_line_crnn_ctc_digital_peter.yaml

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"
  img_height: 32
  max_width: 900
  val_fraction: 0.03
  num_workers: 96
  augmentation_train: false

model:
  name: transformer_encoder_line_ctc
  transformer_d_model: 192
  transformer_nhead: 4
  transformer_encoder_layers: 2
  transformer_ff_dim: 768
  dropout: 0.1

training:
  objective: ctc
  batch_size: 864
  epochs: 5
  lr: 0.01
  experiment_name: "two_stage_line_placeholder_section44"
  checkpoint_dir: "training/checkpoints"
