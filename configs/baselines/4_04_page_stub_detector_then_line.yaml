# §4.4 — плейсхолдер двух этапов; строковый этап без детектора. Память — как transformer §4.3 .

methodology_profile:
  report_section: "4.4"
  short_name: page_detector_then_line_placeholder_line_phase
  status: partially_implemented
  note: только coco_lines строка; параметры см. строковые профили .

detector_training:
  status: scaffold
  coco_json_placeholder: ""
  image_root_placeholder: ""
  batch_size_placeholder: null
  epochs_placeholder: null
  lr_placeholder: null

line_recognizer_training_reference:
  recommends_overlay_after_detector: configs/baselines/4_03_line_stub_transformer_encoder_attention.yaml

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"
  img_height: 32
  val_fraction: 0.03
  num_workers: 0
  augmentation_train: false

model:
  name: transformer_encoder_line_ctc
  transformer_d_model: 144
  transformer_nhead: 4
  transformer_encoder_layers: 2
  transformer_ff_dim: 576
  dropout: 0.1

training:
  objective: ctc
  batch_size: 1
  epochs: 2
  lr: 0.05
  experiment_name: "two_stage_line_placeholder_section44"
  checkpoint_dir: "training/checkpoints"
