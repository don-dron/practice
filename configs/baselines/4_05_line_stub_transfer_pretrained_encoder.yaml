# §4.5 — дообучение строкового распознавателя поверх кодировочной части ResNet-18 из ImageNet (упрощённый stem под низкий H=32).

methodology_profile:
  report_section: "4.5"
  short_name: transfer_pretrained_resnet18_then_line_ctc
  status: implemented
  note: Весов ImageNet в первых слоях ResNet через torchvision; см. pretrained_resnet_line_ctc и freeze_encoder_until_epoch.

planned_transfer_policy:
  backbone_checkpoint_or_url: ""
  backbone_topology_reference: resnet18_line_ctc_bundle
  freeze_encoder_until_epoch: 2
  encoder_lr_multiplier: null
  decoder_head_lr_multiplier: null

project:
  seed: 42
  device: "cuda"

data:
  sources: null
  kind: coco_lines
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"
  img_height: 32
  max_width: 900
  val_fraction: 0.03
  num_workers: 12
  augmentation_train: false

model:
  name: pretrained_resnet_line_ctc
  imagenet_pretrained: true

training:
  objective: ctc
  batch_size: 22
  epochs: 60
  lr: 0.001
  experiment_name: "pretrained_backbone_section45"
  checkpoint_dir: "training/checkpoints"
