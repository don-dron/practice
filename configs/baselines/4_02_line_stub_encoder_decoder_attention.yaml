# §4.2 — строковый энкодер–декодер с механизмом внимания (YAML зафиксирован для §5.1 до реализации в коде).

methodology_profile:
  report_section: "4.2"
  short_name: line_stub_encoder_decoder_attention
  status: scaffold_yaml_only
  note: После сборки архитектуры замените model.name на боевое значение из resolve_model; при необходимости скорректируйте training.* и planned_model.*

planned_model:
  arch: convolutional_encoder_bilstm_or_transformer_slices_tbd
  decoder: sequential_attention_autoregressive
  loss: token_cross_entropy
  decoding: beam_search_recommended_when_implemented

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/digital_peter/annotations_train.json"
  image_root: "data/digital_peter/images"
  text_field: "translation"
  img_height: 32
  max_width: 900
  val_fraction: 0.03
  num_workers: 0
  augmentation_train: false

model:
  name: stub_section_4_2_attention_decoder_line

training:
  batch_size: 8
  epochs: 10
  lr: 0.001
  experiment_name: "stub_report_section_4_2"
  checkpoint_dir: "training/checkpoints/stub_sections"
