# §4.2 — attention_line_seq2seq (teacher forcing CE). Память: batch/max_width совпадают с default если не переопределить.
# Сервер: поднимите training.batch_size, data.max_width, model.lstm_* в отдельном overlay.

methodology_profile:
  report_section: "4.2"
  short_name: line_attention_decoder
  status: implemented
  note: model.name attention_line_seq2seq; training.objective attention_ce .

planned_model:
  arch: convolutional_encoder_bilstm_or_transformer_slices_tbd
  decoder: sequential_attention_autoregressive
  loss: token_cross_entropy
  decoding: beam_search_recommended_when_implemented

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"
  img_height: 32
  val_fraction: 0.03
  num_workers: 0
  augmentation_train: false

model:
  name: attention_line_seq2seq
  lstm_hidden_encoder: 256
  encoder_lstm_layers: 2

training:
  objective: attention_ce
  decoder_max_steps: 160
  attention_loss_microbatch: 1
  batch_size: 1
  epochs: 2
  lr: 0.05
  experiment_name: "line_attention_section42"
  checkpoint_dir: "training/checkpoints"
