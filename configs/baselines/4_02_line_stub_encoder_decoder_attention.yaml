# §4.2 — строковый энкодер–декодер с механизмом внимания (реализован как CNN+BiLSTM + декодер с additive attention).

methodology_profile:
  report_section: "4.2"
  short_name: line_attention_decoder
  status: implemented
  note: model.name attention_line_seq2seq; цель обучения training.objective attention_ce (teacher forcing CE).

planned_model:
  arch: convolutional_encoder_bilstm_or_transformer_slices_tbd
  decoder: sequential_attention_autoregressive
  loss: token_cross_entropy
  decoding: beam_search_recommended_when_implemented

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/digital_peter/annotations_train.json"
  image_root: "data/digital_peter/images"
  text_field: "translation"
  img_height: 32
  max_width: 900
  val_fraction: 0.03
  num_workers: 12
  augmentation_train: false

model:
  name: attention_line_seq2seq
  lstm_hidden_encoder: 256
  encoder_lstm_layers: 2

training:
  objective: attention_ce
  decoder_max_steps: 512
  batch_size: 112
  epochs: 60
  lr: 0.001
  experiment_name: "line_attention_section42"
  checkpoint_dir: "training/checkpoints"
