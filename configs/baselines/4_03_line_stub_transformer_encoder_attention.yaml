# §4.3 — transformer_encoder_line_ctc. Тяжёлый блок; малая VRAM: оставить batch/max_width как в default (+ при желании configs/gpu_large.yaml).
# Серверный batch см. configs/baselines/gpu_server_line_train_budget.yaml (адаптируйте batch/model под карту).

methodology_profile:
  report_section: "4.3"
  short_name: transformer_encoder_line_ctc_implemented
  status: implemented
  note: model.transformer_* в resolve_model/build .

planned_model:
  encoder: transformer_or_hybrid_patch_tokens_after_cnn_reduction
  head: linear_ctc_or_small_decoder_placeholder
  loss: ctloss_or_joint_ce
  decoding: greedy_or_beam_placeholder

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"
  img_height: 32
  val_fraction: 0.03
  num_workers: 0
  augmentation_train: false

model:
  name: transformer_encoder_line_ctc
  transformer_d_model: 160
  transformer_nhead: 4
  transformer_encoder_layers: 2
  transformer_ff_dim: 640
  dropout: 0.1

training:
  objective: ctc
  batch_size: 1
  epochs: 5
  lr: 0.05
  experiment_name: "transformer_encoder_section43"
  checkpoint_dir: "training/checkpoints"
