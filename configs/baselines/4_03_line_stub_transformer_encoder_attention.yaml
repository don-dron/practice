# §4.3 — трансформерный кодировщик признаков строки после CNN-сжатия с головкой CTC.

methodology_profile:
  report_section: "4.3"
  short_name: transformer_encoder_line_ctc_implemented
  status: implemented
  note: model.name transformer_encoder_line_ctc; параметры model.transformer_* в resolve_model/build.

planned_model:
  encoder: transformer_or_hybrid_patch_tokens_after_cnn_reduction
  head: linear_ctc_or_small_decoder_placeholder
  loss: ctloss_or_joint_ce

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/digital_peter/annotations_train.json"
  image_root: "data/digital_peter/images"
  text_field: "translation"
  img_height: 32
  max_width: 900
  val_fraction: 0.03
  num_workers: 0
  augmentation_train: false

model:
  name: transformer_encoder_line_ctc
  transformer_d_model: 256
  transformer_nhead: 4
  transformer_encoder_layers: 2
  transformer_ff_dim: 1024
  dropout: 0.1

training:
  objective: ctc
  batch_size: 8
  epochs: 10
  lr: 0.001
  experiment_name: "transformer_encoder_section43"
  checkpoint_dir: "training/checkpoints"
