# §4.3 — трансформерный кодировщик изображения строки ± CTC или лёгкий декодер (YAML зафиксирован до реализации).

methodology_profile:
  report_section: "4.3"
  short_name: line_stub_transformer_encoder_attention
  status: scaffold_yaml_only
  note: Специализированные параметры (число слоёв, головы, пороговый шаг патч-сетки) перенести под keys model.* когда появится builder.

planned_model:
  encoder: transformer_or_hybrid_patch_tokens_after_cnn_reduction
  head: linear_ctc_or_small_decoder_placeholder
  loss: ctloss_or_joint_ce

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/digital_peter/annotations_train.json"
  image_root: "data/digital_peter/images"
  text_field: "translation"
  img_height: 32
  max_width: 900
  val_fraction: 0.03
  num_workers: 0
  augmentation_train: false

model:
  name: stub_section_4_3_transformer_line_encoder

training:
  batch_size: 8
  epochs: 10
  lr: 0.001
  experiment_name: "stub_report_section_4_3"
  checkpoint_dir: "training/checkpoints/stub_sections"
