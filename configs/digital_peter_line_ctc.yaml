# Совместимо с более ранними инструкциями; канонический путь — configs/baselines/4_01_line_crnn_ctc_digital_peter.yaml .

methodology_profile:
  report_section: "4.1"
  short_name: line_crnn_bilstm_ctc_digital_peter
  status: trainable

project:
  seed: 42
  device: "cuda"

data:
  kind: coco_lines
  coco_json: "data/digital_peter/annotations_train.json"
  image_root: "data/digital_peter/images"
  text_field: "translation"
  img_height: 32
  max_width: 900
  val_fraction: 0.03
  num_workers: 8
  augmentation_train: false

model:
  name: crnn_ctc
  lstm_hidden: 256

training:
  batch_size: 32
  epochs: 20
  lr: 0.001
  experiment_name: "dpeter_crnn_ctc"
  checkpoint_dir: "training/checkpoints"

infer:
  checkpoint: "training/checkpoints/latest.pt"
