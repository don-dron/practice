# Большая VRAM (~24 ГБ+, сервер/A100): см. комментарий в configs/default.yaml.
#   htr-train -c configs/default.yaml -c configs/gpu_large.yaml
# Подстраивайте batch_size под вашу карту и data.num_workers.

training:
  epochs: 5
  hardware_utilization: max
  main_torch_threads: null
  batch_size: 128
  gradient_accumulation_steps: 8
  cudnn_enabled: true
  cudnn_benchmark: true
  amp: true
  cuda_empty_cache_after_backward: false
  cuda_empty_cache_after_optimizer_step: false
  cpu_line_finalize: false
  cuda_line_resize_on_device: true
  cuda_jpeg_decode_batched: false
  val_max_batches: 120

model:
  lstm_hidden: 256

data:
  num_workers: 4
  preprocessed_ram_cache_max_gb: 2
  max_width: 1200
