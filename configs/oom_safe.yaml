# Экстремально мало VRAM / всё ещё CUDA OOM после default (batch 1 + accum 8).
#   htr-train --config configs/default.yaml --config configs/oom_safe.yaml

training:
  batch_size: 1
  lr: 0.05
  gradient_accumulation_steps: 16
  cudnn_benchmark: false
  cuda_line_resize_on_device: false
  cuda_jpeg_decode_batched: false
  val_max_batches: 8

data:
  max_width: 256
  num_workers: 0
  preprocessed_ram_cache_max_gb: 0
