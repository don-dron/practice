# Google Colab (часто 12–16 ГБ VRAM или лимиты): смешение с уже «8ГБ-ориентированным» default.yaml.
#
#   htr-train --config configs/default.yaml --config configs/colab.yaml
#
# При OOM добавьте третий: --config configs/oom_safe.yaml
# Дополнительно: данные в /content/... Для большего числа воркеров: export HTR_COLAB_NUM_WORKERS=4.

training:
  batch_size: 8
  lr: 0.05
  hardware_utilization: normal
  main_torch_threads: 2
  cuda_line_resize_on_device: false

data:
  num_workers: 0
  preprocessed_ram_cache_max_gb: 0
