# Google Colab (часто 12–16 ГБ VRAM): поверх уже «узкого» default.yaml — больший batch и cuDNN+AMP.
#
#   htr-train -c configs/default.yaml -c configs/colab.yaml
#
# Если снова OOM — уменьшите batch_size или добавьте training.cudnn_enabled: false только в локальном оверлее.

training:
  epochs: 5
  batch_size: 8
  lr: 0.05
  hardware_utilization: normal
  main_torch_threads: 2
  cudnn_enabled: true
  cudnn_benchmark: false
  amp: true
  cuda_empty_cache_after_backward: false
  cuda_empty_cache_after_optimizer_step: false
  cuda_line_resize_on_device: false

data:
  num_workers: 0
  preprocessed_ram_cache_max_gb: 0
