# Google Colab: ещё жёстче, чем default (batch 256). Иначе достаточно только configs/default.yaml.
#
#   htr-train --config configs/default.yaml --config configs/colab.yaml
#
# Дополнительно: данные в /content/... (не Google Drive), пока кэш не заполнен — первая эпоха дольше.
# Воркеры: export HTR_COLAB_NUM_WORKERS=6 (или 8), если хватает RAM.

training:
  batch_size: 128
  lr: 0.01
  hardware_utilization: normal
  main_torch_threads: 2

data:
  preprocessed_ram_cache_max_gb: 3
