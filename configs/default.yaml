# Базовый конфиг пайплайна: наследуйте через другие YAML или перекройте ключи.

project:
  seed: 42
  device: "cuda"  # cuda | cpu | mps

data:
  kind: coco_lines
  # По умолчанию — три корпуса (два COCO-строк + страницы PNG+TXT). Оверлеи не трогают sources → обучение остаётся на всех трёх.
  # Чтобы брать только один набор после merge, переопределите data.sources явным одноэлементным списком.
  sources:
    - kind: coco_lines
      coco_json: "data/yenisei_gov_reports_td/train.json"
      image_root: "data/yenisei_gov_reports_td/train_images"
      text_field: "transcription"
      cache_namespace: "yenisei"
    - kind: coco_lines
      coco_json: "data/digital_peter/annotations_train.json"
      image_root: "data/digital_peter/images"
      text_field: "translation"
      cache_namespace: "digital_peter"
    - kind: page_txt_pairs
      pair_root: "data/russian_old_orthography_ocr"
      cache_namespace: "russian_old_orthography"
      max_text_chars: 8192
      optional: true
  page_txt_max_chars_default: null
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"           # Yenisei: attributes.transcription; для infer/legacy при отсутствии sources[]
  split_annotation: null               # если null — все аннотации из файла как один сплит
  img_height: 32
  max_width: 1200                       # ограничение по ширине после масштабирования высоты
  min_crop_width: 4
  val_fraction: 0.05                   # простой случайный hold-out если отдельного val-json нет
  # Скорость vs CPU: меньше воркеров → меньше загрузка CPU, но часто дольше эпоха (GPU ждёт). Реально уменьшить работу
  # CPU на тот же темп — дать заполниться preprocessed_cache_dir (после 1-го прохода декода меньше).
  num_workers: 12
  # Внутри каждого воркера ограничить PyTorch/OpenMP (иначе num_workers × десятки потоков забьют CPU, GPU ждёт батч).
  # 0 — не трогать (старое поведение).
  dataloader_worker_torch_threads: 1

  augmentation_train: false
  prefetch_factor: 8
  # После первого прохода датасета — строки как .pt по хэшу (имя файла,bbox,height,max_width,min_width).
  # Снимает декод JPEG на последующих эпохах; не совместимо с augmentation_train: true. Очистка: удалите каталог.
  preprocessed_cache_dir: "training/preprocessed_cache"
  # LRU строк в RAM, сумма ~GiB между пулами workers train+val; при num_workers=0 всё на главном процессе.
  # 0 — только диск-кэш (если указан preprocessed_cache_dir) или без кэша.
  preprocessed_ram_cache_max_gb: 6
  # если пусто — алфавит собирается по обучающей выборке перед стартом
  extra_chars: ""

model:
  name: crnn_ctc
  cnn_channels: [64, 128, 256, 256]
  lstm_hidden: 256
  lstm_layers: 2
  dropout: 0.0

training:
  batch_size: 144
  epochs: 5
  lr: 0.0005
  weight_decay: 0.0
  clip_grad_norm: 5.0
  checkpoint_dir: "training/checkpoints"
  experiment_name: "multi_yenisei_dp_roo"
  save_every_epochs: 1
  amp: true
  cudnn_benchmark: true
  allow_tf32: true
  # Для CUDA обычно 2 — меньше конкуренции с воркерами; чисто CPU-тренировка — поставьте null.
  main_torch_threads: 2
  # Усечь val до N батчей (сильно ускоряет эпоху; val-метрика по подвыборке). null = прогонять весь val.
  val_max_batches: 120
  # Только PyTorch 2+ и CUDA: компиляция графа (первый проход медленнее; бывает несовместима с частью моделей).
  torch_compile: false
  # default | reduce-overhead | max-autotune
  torch_compile_mode: default

infer:
  checkpoint: "training/checkpoints/latest.pt"
  beam_size: 1
