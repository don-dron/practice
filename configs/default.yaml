# Базовый конфиг пайплайна: наследуйте через другие YAML или перекройте ключи.

project:
  seed: 42
  device: "cuda"  # cuda | cpu | mps

data:
  kind: coco_lines
  # По умолчанию — три корпуса (два COCO-строк + страницы PNG+TXT). Оверлеи не трогают sources → обучение остаётся на всех трёх.
  # Чтобы брать только один набор после merge, переопределите data.sources явным одноэлементным списком.
  sources:
    - kind: coco_lines
      coco_json: "data/yenisei_gov_reports_td/train.json"
      image_root: "data/yenisei_gov_reports_td/train_images"
      text_field: "transcription"
      cache_namespace: "yenisei"
    - kind: coco_lines
      coco_json: "data/digital_peter/annotations_train.json"
      image_root: "data/digital_peter/images"
      text_field: "translation"
      cache_namespace: "digital_peter"
    - kind: page_txt_pairs
      pair_root: "data/russian_old_orthography_ocr"
      cache_namespace: "russian_old_orthography"
      max_text_chars: 8192
      optional: true
  page_txt_max_chars_default: null
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"           # Yenisei: attributes.transcription; для infer/legacy при отсутствии sources[]
  split_annotation: null               # если null — все аннотации из файла как один сплит
  img_height: 32
  max_width: 1200                       # ограничение по ширине после масштабирования высоты
  min_crop_width: 4
  val_fraction: 0.05                   # простой случайный hold-out если отдельного val-json нет
  # Скорость vs CPU: меньше воркеров → меньше загрузка CPU, но часто дольше эпоха (GPU ждёт). Реально уменьшить работу
  # CPU на тот же темп — дать заполниться preprocessed_cache_dir (после 1-го прохода декода меньше).
  # PNG-heavy: decode всё ещё на CPU (libpng); GPU грузится сильнее после заполнения preprocessed_cache_dir или при JPEG.
  # Поднять num_workers / SSD; оффлайн конверт PNG→JPEG для COCO ускоряет подачу (nvJPEG в collate).
  # Меньше параллельных воркеров с GPU-collate → меньше VRAM; на сильном CPU поднимите при отсутствии OOM.
  num_workers: 16
  # Внутри каждого воркера ограничить PyTorch/OpenMP (иначе num_workers × десятки потоков забьют CPU).
  # auto — при training.hardware_utilization: max; иначе трактуется как 1. Явное число | 0 — не трогать воркер.
  dataloader_worker_torch_threads: auto
  # Только Windows: временно быстрее подача батча (кап воркеров 8, prefetch до 8, persistent_workers). Или: set HTR_WIN_DATALOADER_FAST=1
  # Риск снова увидеть 1455 — тогда false / убрать env, либо num_workers: 0.
  windows_dataloader_fast: false

  augmentation_train: false
  # auto: min(16, num_workers) с учётом caps Colab/Windows в коде; или целое число.
  prefetch_factor: auto
  # После первого прохода датасета — строки как .pt по хэшу (имя файла,bbox,height,max_width,min_width).
  # Снимает декод JPEG на последующих эпохах; не совместимо с augmentation_train: true. Очистка: удалите каталог.
  preprocessed_cache_dir: "training/preprocessed_cache"
  # LRU строк в RAM, сумма ~GiB между пулами workers train+val; при num_workers=0 всё на главном процессе.
  # 0 — только диск-кэш (если указан preprocessed_cache_dir) или без кэша.
  preprocessed_ram_cache_max_gb: 6
  # если пусто — алфавит собирается по обучающей выборке перед стартом
  extra_chars: ""

model:
  name: crnn_ctc
  cnn_channels: [64, 128, 256, 256]
  lstm_hidden: 256
  lstm_layers: 2
  dropout: 0.0

training:
  # normal | max | low — по умолчанию max: авто main/interop/OMP, prefetch/worker threads auto; для слабой машины: normal
  hardware_utilization: max
  # Было 1728 — тяжело по VRAM при GPU-collate; 512 + lr ниже. Сильный сервер без OOM можно поднять.
  batch_size: 512
  epochs: 20
  # Линейно от прежних 0.0005 @ batch 1728 (~0.000148); подстройте при «плывущем» loss.
  lr: 0.00015
  weight_decay: 0.0
  clip_grad_norm: 5.0
  checkpoint_dir: "training/checkpoints"
  experiment_name: "multi_yenisei_dp_roo"
  save_every_epochs: 1
  amp: true
  # CUDA: decode_jpeg(страницы COCO .jpg) на GPU; .png COCO и page_txt — сырые байты в collate, decode_png (lib CPU) затем весь тензорный пайп на GPU. false — декод в воркерах.
  cuda_jpeg_decode_batched: true
  # После кропа (uint8): ресайз линии + [-1,1] на GPU для COCO/page_txt при cuda/mps. Сам декод PNG/страницы page_txt — в воркерах на CPU (см. лог [htr-train] CPU/GPU).
  cuda_line_resize_on_device: true
  # Пока GPU считает батч N, фоновый поток подтягивает следующие CPU-батчи из DataLoader (CUDA/MPS).
  async_training_batch_prefetch: true
  async_prefetch_queue_size: 1
  # Параллельное чтение только текстов для алфавита (индексы образов не трогаются); для >4096 строк и max/флага
  parallel_charset_text_reads: true
  cudnn_benchmark: true
  allow_tf32: true
  # null — при hardware_utilization: max подставится авто в train.py; иначе можно задать явно (напр. 2 для CUDA).
  main_torch_threads: null
  # Усечь val до N батчей (сильно ускоряет эпоху; val-метрика по подвыборке). null = прогонять весь val.
  val_max_batches: 120
  # Только PyTorch 2+ и CUDA: компиляция графа (первый проход медленнее; бывает несовместима с частью моделей).
  torch_compile: false
  # default | reduce-overhead | max-autotune
  torch_compile_mode: default

infer:
  checkpoint: "training/checkpoints/latest.pt"
  beam_size: 1
