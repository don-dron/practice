# Базовый конфиг проекта (единственный, если вы всегда передаёте только default.yaml).
# Ориентир: малая VRAM (~4–8 ГБ), узкая лента (max_width), без cuDNN-свёрток, медленнее но стабильнее по памяти.
# Большая карта / сервер: добавьте второй YAML — configs/gpu_large.yaml (скорость, batch, LSTM 256, cuDNN+AMP).

project:
  seed: 42
  device: "cuda"  # cuda | cpu | mps

data:
  kind: coco_lines
  sources:
    - kind: coco_lines
      coco_json: "data/yenisei_gov_reports_td/train.json"
      image_root: "data/yenisei_gov_reports_td/train_images"
      text_field: "transcription"
      cache_namespace: "yenisei"
  page_txt_max_chars_default: null
  coco_json: "data/yenisei_gov_reports_td/train.json"
  image_root: "data/yenisei_gov_reports_td/train_images"
  text_field: "transcription"
  split_annotation: null
  img_height: 32
  max_width: 192
  min_crop_width: 4
  val_fraction: 0
  train_subsample_divisor: 150
  num_workers: 0
  dataloader_worker_torch_threads: auto
  windows_dataloader_fast: false

  augmentation_train: false
  prefetch_factor: auto
  preprocessed_cache_dir: "training/preprocessed_cache"
  preprocessed_ram_cache_max_gb: 0
  extra_chars: ""

model:
  name: crnn_ctc
  cnn_channels: [64, 128, 256, 256]
  lstm_hidden: 128
  lstm_layers: 2
  dropout: 0.0

training:
  hardware_utilization: normal
  main_torch_threads: 2
  batch_size: 1
  epochs: 2
  gradient_accumulation_steps: 16
  lr: 0.05
  weight_decay: 0.0
  clip_grad_norm: 5.0
  checkpoint_dir: "training/checkpoints"
  experiment_name: "yenisei_gov_reports_td"
  save_every_epochs: 1
  checkpoint_overwrite: false
  amp: false
  cuda_jpeg_decode_batched: false
  cuda_line_resize_on_device: false
  cpu_line_finalize: true
  async_training_batch_prefetch: false
  async_prefetch_queue_size: 1
  parallel_charset_text_reads: true

  cudnn_enabled: false
  cudnn_benchmark: false
  allow_tf32: true

  cuda_empty_cache_after_backward: true
  cuda_empty_cache_after_optimizer_step: true

  val_max_batches: 8
  attention_loss_microbatch: null
  torch_compile: false
  torch_compile_mode: default

infer:
  checkpoint: "training/checkpoints/latest.pt"
  beam_size: 1
